<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar livros</title>
</head>
<body>
    <main>
        <h1>Lista de livros</h1>
        {% for livro in livros %}
           <p> <strong>Título:</strong> {{ livro.titulo }} </p>
           {% for autor in livro.autores.all %}
               <a href="{% url 'biblioteca:author_detail' autor.id %}">
                   <p> <strong>Autor:</strong> {{ autor.nome }} </p>
               </a>
           {% endfor %}
           <p> <strong>Ano de publicação:</strong>{{ livro.ano_publicacao }}</p>
           <a href="{% url 'biblioteca:livro_form' pk=livro.pk %}">Editar</a>
           <hr width="25%" align="left">
        {% endfor %}
        <a href="{% url 'biblioteca:author_cadastro' %}">Novo autor</a>
        <a href="{% url 'biblioteca:livro_form' %}">Novo livro</a>
    </main>
</body>
</html>
