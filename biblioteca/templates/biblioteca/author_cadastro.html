<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cadastrar Autor</h1>
    <form action="{% url 'biblioteca:author_cadastro'%}" method="post">
        {%csrf_token%}
        <div>
            {{form.nome.label_tag}}
            {{form.nome}}
            {{form.nome.errors}}
        </div>
        <div>
            {{form.nacionalidade.label_tag}}
            {{form.nacionalidade}}
            {{form.nacionalidade.errors}}
        </div>
        <button type="submit">Cadastrar</button>
    </form>
    
</body>
</html>
